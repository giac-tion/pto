<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PTO Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --slate-900: #0f172a;
            --slate-700: #334155;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --emerald-500: #10b981;
            --emerald-600: #059669;
            --red-500: #ef4444;
            --amber-500: #f59e0b;
            --blue-500: #3b82f6;
            --white: #ffffff;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--slate-100);
            color: var(--slate-700);
            min-height: 100vh;
            padding: 2rem clamp(1rem, 3vw, 3rem);
        }

        .container {
            width: 100%;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--white);
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--slate-200);
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: minmax(280px, 0.9fr) minmax(420px, 1.35fr) minmax(280px, 0.9fr);
            gap: 2rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: 1fr 1fr;
            }

            .add-event-column {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 720px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .add-event-column {
                grid-column: auto;
            }
        }

        .card {
            background: var(--white);
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--slate-900);
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--slate-100);
            padding-bottom: 0.75rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-box {
            background: var(--slate-100);
            padding: 1rem;
            border-radius: 6px;
            text-align: center;
            border-left: 4px solid var(--emerald-500);
        }

        .stat-number {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--emerald-600);
            margin-bottom: 0.25rem;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--slate-600);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--slate-700);
            margin-bottom: 0.4rem;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid var(--slate-200);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="date"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: var(--blue-500);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: inline-block;
        }

        .btn-primary {
            background: var(--emerald-500);
            color: var(--white);
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--emerald-600);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }

        .calendar {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .calendar thead {
            background: var(--slate-100);
        }

        .calendar th {
            padding: 0.75rem;
            text-align: center;
            font-weight: 600;
            color: var(--slate-700);
            border-bottom: 2px solid var(--slate-200);
        }

        .calendar td {
            padding: 0.5rem;
            text-align: center;
            border: 1px solid var(--slate-100);
            height: 40px;
            position: relative;
        }

        .calendar td:not(.other-month) {
            cursor: pointer;
        }

        .calendar td.calendar-selected {
            z-index: 1;
            outline: 3px solid var(--blue-500);
            outline-offset: -3px;
            animation: calendar-selection-pulse 0.55s ease-out;
        }

        @keyframes calendar-selection-pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.65);
            }
            100% {
                box-shadow: 0 0 0 9px rgba(59, 130, 246, 0);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .calendar td.calendar-selected {
                animation: none;
            }
        }

        .calendar td.other-month {
            background: var(--slate-50);
            color: var(--slate-400);
        }

        .calendar td.today {
            background: var(--blue-500);
            color: var(--white);
            font-weight: 600;
        }

        .calendar td.pto {
            background: #dbeafe;
            color: var(--slate-900);
        }

        .calendar td.pto.wfh {
            background: #e0d5ff;
            color: var(--slate-900);
        }

        .calendar td.pto.comp {
            background: #dcfce7;
            color: var(--slate-900);
        }

        .calendar td.holiday {
            background: #fef3c7;
            color: var(--slate-900);
        }

        .calendar td.half-holiday {
            background: linear-gradient(135deg, #fef3c7 0 50%, var(--white) 50% 100%);
        }

        .calendar td.pto.half-holiday {
            background: linear-gradient(135deg, #fef3c7 0 50%, #dbeafe 50% 100%);
        }

        .calendar-month-card {
            padding: 1rem;
        }

        .calendar-month-title {
            color: var(--slate-900);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
        }

        .calendar-month-card + .calendar-month-card {
            margin-top: 1rem;
        }

        .calendar-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .calendar-controls button,
        .event-control {
            border: 1px solid var(--slate-200);
            background: var(--white);
            color: var(--slate-700);

        .event-edit-fields {
            display: grid;
            grid-template-columns: minmax(120px, 1fr) auto;
            gap: 0.35rem;
        }

        .event-edit-fields input,
        .event-edit-fields select {
            min-width: 0;
            padding: 0.35rem;
            border: 1px solid var(--slate-200);
            border-radius: 4px;
            font: inherit;
        }
            border-radius: 4px;
            cursor: pointer;
        }

        .calendar-controls button {
            padding: 0.4rem 0.8rem;
            font-size: 1rem;
        }

        .calendar-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 0.75rem;
            color: var(--slate-600);
            font-size: 0.72rem;
            margin-top: 0.75rem;
        }

        .legend-item::before {
            content: '';
            display: inline-block;
            width: 0.65rem;
            height: 0.65rem;
            margin-right: 0.25rem;
            vertical-align: -1px;
            background: #fef3c7;
        }

        .legend-item.half::before {
            background: linear-gradient(135deg, #fef3c7 0 50%, var(--white) 50% 100%);
            border: 1px solid var(--slate-200);
        }

        .event-log {
            overflow-x: auto;
        }

        .event-log .ledger-table {
            min-width: 560px;
        }

        .event-reason {
            color: var(--slate-900);
            font-weight: 600;
        }

        .event-date {
            white-space: nowrap;
        }

        .event-controls {
            display: flex;
            gap: 0.25rem;
            white-space: nowrap;
        }

        .event-control {
            width: 1.9rem;
            height: 1.9rem;
            padding: 0;
            font-size: 0.95rem;
            line-height: 1;
        }

        .event-control.mode-toggle {
            font-weight: 700;
            color: var(--emerald-600);
        }

        .event-control:hover,
        .calendar-controls button:hover {
            background: var(--slate-100);
        }

        .event-type {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .calendar-number {
            font-weight: 600;
            margin-bottom: 2px;
        }

        .calendar-badge {
            font-size: 0.65rem;
            padding: 1px 3px;
            border-radius: 2px;
            background: rgba(0,0,0,0.1);
        }

        .ledger-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .ledger-table thead {
            background: var(--slate-100);
        }

        .ledger-table th {
            padding: 0.75rem;
            text-align: left;
            font-weight: 600;
            color: var(--slate-700);
            border-bottom: 2px solid var(--slate-200);
        }

        .ledger-table td {
            padding: 0.75rem;
            border-bottom: 1px solid var(--slate-100);
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--slate-500);
        }

        .empty-state-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .alert {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #dcfce7;
            color: var(--emerald-700);
            border-left: 4px solid var(--emerald-500);
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid var(--red-500);
        }

        .auth-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-top: 1rem;
        }

        .auth-status {
            color: var(--slate-200);
            font-size: 0.85rem;
        }

        .auth-button {
            border: 1px solid var(--slate-200);
            border-radius: 6px;
            padding: 0.55rem 0.9rem;
            background: var(--white);
            color: var(--slate-700);
            cursor: pointer;
        }

        .auth-button:hover {
            background: var(--slate-100);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PTO Tracker</h1>
            <p class="subtitle">Plan and track your paid time off</p>
            <div class="auth-bar">
                <span id="authStatus" class="auth-status">Sign in to sync your events</span>
                <button id="authButton" class="auth-button" type="button">Sign in with Google</button>
            </div>
        </header>

        <div class="grid">
            <div class="calendar-column">
                <div class="card">
                    <div class="calendar-controls">
                        <button type="button" onclick="prevMonth()" aria-label="Show previous three months">←</button>
                        <strong>Calendar</strong>
                        <button type="button" onclick="nextMonth()" aria-label="Show next three months">→</button>
                    </div>
                    <div id="calendarStack"></div>
                    <div class="calendar-legend">
                        <span class="legend-item">Full holiday</span>
                        <span class="legend-item half">Half-day</span>
                    </div>
                </div>
            </div>

            <div class="overview-column">
                <div class="card">
                    <div class="card-title">PTO Overview</div>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-number" id="totalPTO">20</div>
                            <div class="stat-label">PTO Days Left</div>
                        </div>
                        <div class="stat-box" style="border-left-color: var(--emerald-500);">
                            <div class="stat-number" id="ptoCount">0</div>
                            <div class="stat-label">PTO Scheduled</div>
                        </div>
                        <div class="stat-box" style="border-left-color: var(--amber-500);">
                            <div class="stat-number" id="wfhCount">0</div>
                            <div class="stat-label">WFH Scheduled</div>
                        </div>
                    </div>
                </div>

                <div class="card" style="margin-top: 1.5rem;">
                    <div class="card-title">Event Log</div>
                    <div class="event-log">
                        <table class="ledger-table">
                            <thead>
                                <tr>
                                    <th>Reason</th>
                                    <th>Type</th>
                                    <th>Days</th>
                                    <th>Start / End</th>
                                    <th>Adjust</th>
                                </tr>
                            </thead>
                            <tbody id="requestList"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="add-event-column">
                <div class="card">
                    <div class="card-title">Add Event</div>
                    <div id="alert" class="alert"></div>
                    <form id="requestForm">
                        <div class="form-group">
                            <label for="reason">Reason</label>
                            <input type="text" id="reason" placeholder="What's this for?">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="startDate">Start Date</label>
                                <input type="date" id="startDate" required>
                            </div>
                            <div class="form-group">
                                <label for="endDate">End Date</label>
                                <input type="date" id="endDate" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="ptoType">Type</label>
                            <select id="ptoType" required>
                                <option value="pto">PTO</option>
                                <option value="wfh">WFH</option>
                                <option value="comp">COMP</option>
                            </select>
                        </div>
                        <button type="submit" class="button btn-primary">Add Event</button>
                    </form>
                </div>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>
        // Data management
        const firebaseConfig = {
            apiKey: 'AIzaSyBc-w93vyObX1fGtPRbaj5LnUEyQDPdN0w',
            authDomain: 'pto-planning.firebaseapp.com',
            projectId: 'pto-planning',
            storageBucket: 'pto-planning.firebasestorage.app',
            messagingSenderId: '913000324328',
            appId: '1:913000324328:web:5b1a3533d47f041c3d7d5d'
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const firestore = firebase.firestore();
        let currentUser = null;
        let unsubscribeFromEvents = null;
        let ptoRequests = [];
        let selectedCalendarDate = null;
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        const PTO_ALLOWANCE = 20;

        // Full holidays are excluded from event totals; half-days remain eligible weekdays.
        const holidays = [
            { date: '2026-01-01', name: "New Year's Day", kind: 'full' },
            { date: '2026-01-19', name: 'Martin Luther King, Jr. Day', kind: 'full' },
            { date: '2026-02-16', name: "Washington's Birthday", kind: 'full' },
            { date: '2026-04-03', name: 'Good Friday', kind: 'full' },
            { date: '2026-05-25', name: 'Memorial Day', kind: 'full' },
            { date: '2026-06-19', name: 'Juneteenth National Independence Day', kind: 'full' },
            { date: '2026-07-03', name: 'Independence Day observed', kind: 'full' },
            { date: '2026-09-07', name: 'Labor Day', kind: 'full' },
            { date: '2026-11-26', name: 'Thanksgiving Day', kind: 'full' },
            { date: '2026-11-27', name: 'Day after Thanksgiving', kind: 'half' },
            { date: '2026-12-24', name: 'Christmas Eve early close', kind: 'half' },
            { date: '2026-12-25', name: 'Christmas Day', kind: 'full' },
            { date: '2027-01-01', name: "New Year's Day", kind: 'full' },
            { date: '2027-01-18', name: 'Martin Luther King, Jr. Day', kind: 'full' },
            { date: '2027-02-15', name: "Washington's Birthday", kind: 'full' },
            { date: '2027-03-26', name: 'Good Friday', kind: 'full' },
            { date: '2027-05-31', name: 'Memorial Day', kind: 'full' },
            { date: '2027-06-18', name: 'Juneteenth observed', kind: 'full' },
            { date: '2027-07-05', name: 'Independence Day observed', kind: 'full' },
            { date: '2027-09-06', name: 'Labor Day', kind: 'full' },
            { date: '2027-11-25', name: 'Thanksgiving Day', kind: 'full' },
            { date: '2027-11-26', name: 'Day after Thanksgiving', kind: 'half' },
            { date: '2027-12-24', name: 'Christmas Day observed', kind: 'full' },
            { date: '2028-01-17', name: 'Martin Luther King, Jr. Day', kind: 'full' },
            { date: '2028-02-21', name: "Washington's Birthday", kind: 'full' },
            { date: '2028-04-14', name: 'Good Friday', kind: 'full' },
            { date: '2028-05-29', name: 'Memorial Day', kind: 'full' },
            { date: '2028-06-19', name: 'Juneteenth National Independence Day', kind: 'full' },
            { date: '2028-07-04', name: 'Independence Day', kind: 'full' },
            { date: '2028-07-03', name: 'Independence Day early close', kind: 'half' },
            { date: '2028-09-04', name: 'Labor Day', kind: 'full' },
            { date: '2028-11-23', name: 'Thanksgiving Day', kind: 'full' },
            { date: '2028-11-24', name: 'Day after Thanksgiving', kind: 'half' },
            { date: '2028-12-25', name: 'Christmas Day', kind: 'full' }
        ];

        function normalizeRequests(requests) {
            return requests.filter(request => isValidDateInput(request.startDate) && isValidDateInput(request.endDate))
                .map(request => {
                    const startDate = request.startDate;
                    const endDate = request.endDate;
                    return {
                        id: request.id || Date.now() + Math.random(),
                        startDate,
                        endDate,
                        type: ['wfh', 'comp'].includes(request.type) ? request.type : 'pto',
                        reason: request.reason || '',
                        days: calculateBusinessDays(startDate, endDate),
                        created: request.created || new Date().toISOString()
                    };
                })
                .filter(request => parseDateInput(request.startDate) <= parseDateInput(request.endDate));
        }

        function isValidDateInput(dateStr) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr || '')) return false;
            const date = parseDateInput(dateStr);
            return !Number.isNaN(date.getTime()) && formatDateInput(date) === dateStr;
        }

        function getHoliday(date) {
            const dateKey = formatDateInput(date);
            return holidays.find(h => h.date === dateKey) || null;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            setDefaultDates();
            renderCalendar();
            updateStats();
            renderLedger();
            setupEventListeners();
            setupFirebaseAuth();
        });

        function setupFirebaseAuth() {
            document.getElementById('authButton').addEventListener('click', () => {
                if (currentUser) {
                    auth.signOut();
                    return;
                }
                auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(error => {
                    showAlert(`Sign-in failed: ${error.message}`, 'error');
                });
            });

            auth.onAuthStateChanged(user => {
                currentUser = user;
                const status = document.getElementById('authStatus');
                const button = document.getElementById('authButton');
                if (unsubscribeFromEvents) {
                    unsubscribeFromEvents();
                    unsubscribeFromEvents = null;
                }

                if (!user) {
                    ptoRequests = [];
                    status.textContent = 'Sign in to sync your events';
                    button.textContent = 'Sign in with Google';
                    renderCalendar();
                    updateStats();
                    renderLedger();
                    return;
                }

                status.textContent = `Signed in as ${user.email || user.displayName || 'Google user'}`;
                button.textContent = 'Sign out';
                unsubscribeFromEvents = firestore.collection('users').doc(user.uid).collection('events')
                    .onSnapshot(snapshot => {
                        ptoRequests = normalizeRequests(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                        renderCalendar();
                        updateStats();
                        renderLedger();
                    }, error => showAlert(`Could not load events: ${error.message}`, 'error'));
            });
        }

        function setDefaultDates() {
            const today = new Date();
            const nextWeek = new Date(today);
            nextWeek.setDate(nextWeek.getDate() + 7);
            document.getElementById('startDate').value = formatDateInput(today);
            document.getElementById('endDate').value = formatDateInput(nextWeek);
        }

        function setupEventListeners() {
            document.getElementById('requestForm').addEventListener('submit', handleSubmit);
            document.getElementById('startDate').addEventListener('change', event => {
                document.getElementById('endDate').value = event.target.value;
            });
            document.getElementById('requestList').addEventListener('click', handleLedgerAction);
        }

        function handleLedgerAction(event) {
            const button = event.target.closest('button[data-action]');
            if (!button) return;

            const action = button.dataset.action;
            const id = button.dataset.id;
            if (action === 'edit') editRequest(id);
            if (action === 'save') saveEditedRequest(id);
            if (action === 'cancel') cancelEdit();
            if (action === 'toggle-mode') toggleAdjustmentMode();
            if (action === 'adjust-front') adjustEvent(id, 'front');
            if (action === 'adjust-back') adjustEvent(id, 'back');
            if (action === 'delete') deleteRequest(id);
        }

        function handleSubmit(e) {
            e.preventDefault();

            if (!currentUser) {
                showAlert('Sign in before adding an event', 'error');
                return;
            }

            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const ptoType = document.getElementById('ptoType').value;
            const reason = document.getElementById('reason').value;

            if (!isValidDateInput(startDate) || !isValidDateInput(endDate) || parseDateInput(startDate) > parseDateInput(endDate)) {
                showAlert('End date must be after start date', 'error');
                return;
            }

            const newRequest = {
                id: String(Date.now()),
                startDate,
                endDate,
                type: ptoType,
                reason,
                days: calculateBusinessDays(startDate, endDate),
                created: new Date().toISOString()
            };

            saveRequest(newRequest);
            showAlert('Event added successfully', 'success');
            document.getElementById('requestForm').reset();
            setDefaultDates();
            renderCalendar();
            updateStats();
            renderLedger();
        }

        function calculateBusinessDays(start, end) {
            if (!isValidDateInput(start) || !isValidDateInput(end)) return 0;
            let count = 0;
            const current = parseDateInput(start);
            const endDate = parseDateInput(end);

            while (current <= endDate) {
                const dayOfWeek = current.getDay();
                const holiday = getHoliday(current);
                if (dayOfWeek !== 0 && dayOfWeek !== 6 && (!holiday || holiday.kind === 'half')) {
                    count++;
                }
                current.setDate(current.getDate() + 1);
            }
            return count;
        }

        function isEligibleDate(date) {
            const holiday = getHoliday(date);
            return date.getDay() !== 0 && date.getDay() !== 6 && (!holiday || holiday.kind === 'half');
        }

        function shiftEligibleDate(date, direction) {
            const shifted = new Date(date);
            do {
                shifted.setDate(shifted.getDate() + direction);
            } while (!isEligibleDate(shifted));
            return shifted;
        }

        function renderCalendar() {
            const stack = document.getElementById('calendarStack');
            stack.innerHTML = '';
            for (let offset = 0; offset < 3; offset++) {
                const date = new Date(currentYear, currentMonth + offset, 1);
                stack.appendChild(renderMonth(date.getFullYear(), date.getMonth()));
            }
        }

        function renderMonth(year, month) {
            const card = document.createElement('div');
            card.className = 'calendar-month-card';
            const title = document.createElement('div');
            title.className = 'calendar-month-title';
            title.textContent = new Date(year, month, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            card.appendChild(title);

            const table = document.createElement('table');
            table.className = 'calendar';
            const header = table.insertRow();
            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(day => {
                const cell = document.createElement('th');
                cell.textContent = day;
                header.appendChild(cell);
            });

            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            let row = table.insertRow();
            for (let index = 0; index < firstDay.getDay(); index++) {
                const cell = row.insertCell();
                cell.className = 'other-month';
            }

            const today = formatDateInput(new Date());
            for (let day = 1; day <= lastDay.getDate(); day++) {
                if (row.cells.length === 7) row = table.insertRow();
                const cellDate = new Date(year, month, day);
                const cell = row.insertCell();
                cell.dataset.date = formatDateInput(cellDate);
                cell.addEventListener('click', () => selectCalendarDate(cellDate));
                if (cell.dataset.date === selectedCalendarDate) cell.classList.add('calendar-selected');
                const holiday = getHoliday(cellDate);
                const ptoOnDate = getPTOForDate(cellDate);
                cell.innerHTML = `<div class="calendar-number">${day}</div>`;
                if (formatDateInput(cellDate) === today) cell.classList.add('today');
                if (holiday) {
                    cell.classList.add(holiday.kind === 'half' ? 'half-holiday' : 'holiday');
                    cell.title = `${holiday.name} (${holiday.kind === 'half' ? 'half-day' : 'full-day'})`;
                    const badge = document.createElement('div');
                    badge.className = 'calendar-badge';
                    badge.textContent = holiday.kind === 'half' ? '½' : 'H';
                    cell.appendChild(badge);
                }
                if (ptoOnDate) {
                    cell.classList.add('pto', ptoOnDate.type);
                    const badge = document.createElement('div');
                    badge.className = 'calendar-badge';
                    badge.textContent = ptoOnDate.type.toUpperCase()[0];
                    cell.appendChild(badge);
                }
            }

            while (row.cells.length < 7) {
                const cell = row.insertCell();
                cell.className = 'other-month';
            }
            card.appendChild(table);
            return card;
        }

        function prevMonth() {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        function nextMonth() {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar();
        }

        function getPTOForDate(date) {
            for (let req of ptoRequests) {
                const start = parseDateInput(req.startDate);
                const end = parseDateInput(req.endDate);
                if (date >= start && date <= end) {
                    return req;
                }
            }
            return null;
        }

        function selectCalendarDate(date) {
            const selectedDate = formatDateInput(date);
            selectedCalendarDate = selectedDate;
            document.querySelectorAll('.calendar-selected').forEach(cell => cell.classList.remove('calendar-selected'));
            const selectedCell = document.querySelector(`[data-date="${selectedDate}"]`);
            if (selectedCell) {
                selectedCell.classList.remove('calendar-selected');
                void selectedCell.offsetWidth;
                selectedCell.classList.add('calendar-selected');
            }
            document.getElementById('startDate').value = selectedDate;
            document.getElementById('endDate').value = selectedDate;
            document.getElementById('reason').focus();
        }

        function updateStats() {
            const ptoDays = ptoRequests
                .filter(req => req.type === 'pto')
                .reduce((sum, req) => sum + (req.days || 0), 0);
            const wfhDays = ptoRequests
                .filter(req => req.type === 'wfh')
                .reduce((sum, req) => sum + (req.days || 0), 0);
            const compDays = ptoRequests
                .filter(req => req.type === 'comp')
                .reduce((sum, req) => sum + (req.days || 0), 0);

            document.getElementById('totalPTO').textContent = Math.max(0, PTO_ALLOWANCE - ptoDays + compDays);
            document.getElementById('ptoCount').textContent = ptoDays;
            document.getElementById('wfhCount').textContent = wfhDays;
        }

        function renderLedger() {
            const list = document.getElementById('requestList');
            const allRequests = [...ptoRequests].sort((a, b) => parseDateInput(a.startDate) - parseDateInput(b.startDate));

            if (allRequests.length === 0) {
                list.innerHTML = '<tr><td colspan="5" class="empty-state">No events yet</td></tr>';
                return;
            }

            list.innerHTML = allRequests.map(req => `
                <tr>
                    <td>${String(editingRequestId) === String(req.id) ? `<div class="event-edit-fields"><input id="edit-reason-${req.id}" value="${escapeHtml(req.reason)}" aria-label="Reason"><input id="edit-start-${req.id}" type="date" value="${req.startDate}" aria-label="Start date"><input id="edit-end-${req.id}" type="date" value="${req.endDate}" aria-label="End date"></div>` : `<span class="event-reason">${escapeHtml(req.reason || 'Unspecified')}</span>`}</td>
                    <td>${String(editingRequestId) === String(req.id) ? `<select id="edit-type-${req.id}" aria-label="Type"><option value="pto" ${req.type === 'pto' ? 'selected' : ''}>PTO</option><option value="wfh" ${req.type === 'wfh' ? 'selected' : ''}>WFH</option><option value="comp" ${req.type === 'comp' ? 'selected' : ''}>COMP</option></select>` : `<span class="event-type">${req.type.toUpperCase()}</span>`}</td>
                    <td>${req.days}</td>
                    <td class="event-date">${formatDate(req.startDate)} → ${formatDate(req.endDate)}</td>
                    <td>
                        <div class="event-controls" aria-label="Adjust ${escapeHtml(req.reason || 'event')}">
                            ${String(editingRequestId) === String(req.id) ? `<button class="event-control" data-action="save" data-id="${escapeHtml(req.id)}" title="Save event">✓</button><button class="event-control" data-action="cancel" title="Cancel editing">×</button>` : `<button class="event-control" data-action="edit" data-id="${escapeHtml(req.id)}" title="Edit event">✎</button>`}
                            ${String(editingRequestId) === String(req.id) ? '' : `
                            <button class="event-control mode-toggle" data-action="toggle-mode" title="Toggle extend or shorten">${adjustmentMode === 'extend' ? '+' : '−'}</button>
                            <button class="event-control" data-action="adjust-front" data-id="${escapeHtml(req.id)}" title="${adjustmentMode === 'extend' ? 'Extend' : 'Shorten'} from front">↑</button>
                            <button class="event-control" data-action="adjust-back" data-id="${escapeHtml(req.id)}" title="${adjustmentMode === 'extend' ? 'Extend' : 'Shorten'} from back">↓</button>
                            <button class="event-control" data-action="delete" data-id="${escapeHtml(req.id)}" title="Delete event">×</button>`}
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        let editingRequestId = null;

        function editRequest(id) {
            editingRequestId = id;
            renderLedger();
        }

        function cancelEdit() {
            editingRequestId = null;
            renderLedger();
        }

        function saveEditedRequest(id) {
            const request = ptoRequests.find(item => String(item.id) === String(id));
            if (!request) return;

            const reason = document.getElementById(`edit-reason-${id}`).value;
            const startDate = document.getElementById(`edit-start-${id}`).value;
            const endDate = document.getElementById(`edit-end-${id}`).value;
            const type = document.getElementById(`edit-type-${id}`).value;
            if (!isValidDateInput(startDate) || !isValidDateInput(endDate) || parseDateInput(startDate) > parseDateInput(endDate)) {
                showAlert('End date must be after start date', 'error');
                return;
            }

            request.reason = reason;
            request.startDate = startDate;
            request.endDate = endDate;
            request.type = type;
            request.days = calculateBusinessDays(startDate, endDate);
            editingRequestId = null;
            saveRequest(request);
            renderCalendar();
            updateStats();
            renderLedger();
            showAlert('Event updated successfully', 'success');
        }


        function deleteRequest(id) {
            ptoRequests = ptoRequests.filter(req => String(req.id) !== String(id));
            if (currentUser) {
                eventsCollection().doc(String(id)).delete().catch(error => showAlert(`Could not delete event: ${error.message}`, 'error'));
            }
            renderCalendar();
            updateStats();
            renderLedger();
        }

        let adjustmentMode = 'extend';

        function toggleAdjustmentMode() {
            adjustmentMode = adjustmentMode === 'extend' ? 'shorten' : 'extend';
            renderLedger();
        }

        function adjustEvent(id, edge) {
            const request = ptoRequests.find(item => String(item.id) === String(id));
            if (!request) return;
            if (!currentUser) {
                showAlert('Sign in before adjusting an event', 'error');
                return;
            }

            const start = parseDateInput(request.startDate);
            const end = parseDateInput(request.endDate);
            const direction = adjustmentMode === 'extend' ? 1 : -1;
            if (edge === 'front') {
                const candidate = shiftEligibleDate(start, direction > 0 ? -1 : 1);
                if (direction < 0 && candidate > end) return;
                request.startDate = formatDateInput(candidate);
            } else {
                const candidate = shiftEligibleDate(end, direction);
                if (direction < 0 && candidate < start) return;
                request.endDate = formatDateInput(candidate);
            }

            request.days = calculateBusinessDays(request.startDate, request.endDate);
            saveRequest(request);
            renderCalendar();
            updateStats();
            renderLedger();
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert show alert-${type}`;
            setTimeout(() => alert.classList.remove('show'), 3000);
        }

        function formatDate(dateStr) {
            return parseDateInput(dateStr).toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric'
            });
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>'"]/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[character]);
        }

        function parseDateInput(dateStr) {
            const [year, month, day] = dateStr.split('-').map(Number);
            return new Date(year, month - 1, day);
        }

        function formatDateInput(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function eventsCollection() {
            return firestore.collection('users').doc(currentUser.uid).collection('events');
        }

        function saveRequest(request) {
            if (!currentUser) return;
            const { id, ...eventData } = request;
            eventsCollection().doc(String(id)).set(eventData).catch(error => {
                showAlert(`Could not save event: ${error.message}`, 'error');
            });
        }

    </script>
</body>
</html>
